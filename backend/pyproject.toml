[project]
name = "plaindr"
version = "0.1.0"
description = "RAG pipeline for AI policy management"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "supabase>=2.0",
    "python-frontmatter>=1.1",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "firecrawl-py>=1.5",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "anthropic>=0.45",
    "httpx>=0.27",
    "pymupdf==1.27.2",
    "playwright>=1.49",
    "markdownify>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plaindr"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/plaindr/api/**" = ["B008"]  # Depends() in defaults is standard FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
