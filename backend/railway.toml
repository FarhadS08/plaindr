[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand — Dockerfile CMD is the single source of truth.
# If you ever need to override locally, do it in the Railway
# dashboard (Settings → Deploy → Custom Start Command) so the
# Dockerfile keeps working for docker run, CI, and any future PaaS.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# /health doesn't require the PolicyStore, so Railway can probe it
# even during the ~30-60s startup while PolicyStore loads.
healthcheckPath = "/health"
healthcheckTimeout = 300
