[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Explicit startCommand overrides the Dockerfile's CMD — keeps a
# single source of truth for how the service starts on Railway.
startCommand = "uv run python -m plaindr serve --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# /health doesn't require the PolicyStore, so Railway can probe it
# even during the ~30-60s startup while PolicyStore loads.
healthcheckPath = "/health"
healthcheckTimeout = 300
